app = "cypher-md"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "cypher_data"
  destination = "/data"

[env]
  PORT = "3000"
  COOKIES_PATH = "/etc/secrets/cookies.txt"

[checks]
  [checks.health]
    type = "tcp"
    port = 3000
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
